<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pathshala Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Hind:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --paper:#FFF9E9; --sheet:#FFFFFF; --ink:#3D2E12; --muted:#8A7145; --head:#FFF1CB;
  --binder:#5B4415; --binder-ink:#FFF6E0; --binder-muted:#D8B978;
  --binder-hover:rgba(255,255,255,.12); --binder-sel:rgba(255,255,255,.20);
  --pencil:#E8912C; --pencil-ink:#3A2400;
  --margin:#F2B8A6; --rule:#F0E3BE; --line:#EADFB8;
  --danger:#B3261E; --danger-solid:#B3261E;
  --note-bg:#FFF0CE; --note-line:#EBCE84;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#221A0C; --sheet:#2E2411; --ink:#FBEFD2; --muted:#C3AD7C; --head:#3A2E14;
    --binder:#140F06; --binder-ink:#FBEFD2; --binder-muted:#B49A64;
    --binder-hover:rgba(255,255,255,.08); --binder-sel:rgba(255,255,255,.13);
    --pencil:#E8912C; --pencil-ink:#2E1900;
    --margin:#7C4A3F; --rule:#4A3B1C; --line:#4F4020;
    --danger:#F08A80; --danger-solid:#B3261E;
    --note-bg:#3A2E14; --note-line:#6B5520;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#221A0C; --sheet:#2E2411; --ink:#FBEFD2; --muted:#C3AD7C; --head:#3A2E14;
  --binder:#140F06; --binder-ink:#FBEFD2; --binder-muted:#B49A64;
  --binder-hover:rgba(255,255,255,.08); --binder-sel:rgba(255,255,255,.13);
  --pencil:#E8912C; --pencil-ink:#2E1900;
  --margin:#7C4A3F; --rule:#4A3B1C; --line:#4F4020;
  --danger:#F08A80; --danger-solid:#B3261E;
  --note-bg:#3A2E14; --note-line:#6B5520;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  height:100%;margin:0;background:var(--paper);color:var(--ink);
  font:400 16px/1.55 'Hind','Noto Sans Devanagari','Mangal',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  -webkit-text-size-adjust:100%;
}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pencil);outline-offset:2px}

.app{display:grid;grid-template-columns:300px minmax(0,1fr);height:100%}

/* ---------- sidebar (the binder) ---------- */
.side{background:var(--binder);color:var(--binder-ink);display:flex;flex-direction:column;min-height:0;padding:18px 14px 12px}
.side-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 6px 14px}
.brand{font:700 22px/1.1 'Baloo 2','Hind',sans-serif;display:flex;align-items:center;gap:9px}
.brand .mark{flex:none;width:30px;height:30px}
.brand .word{display:flex;flex-direction:column;line-height:1.05}
.brand small{font:500 13px 'Hind',sans-serif;color:var(--binder-muted)}
.home-link{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:8px;cursor:pointer;color:inherit;font-weight:600}
.home-link:hover,.row:hover{background:var(--binder-hover)}
.home-link.sel{background:var(--binder-sel)}
.search{margin:8px 0 10px}
.search input{width:100%;padding:8px 10px;border-radius:8px;border:1px solid transparent;background:var(--binder-hover);color:var(--binder-ink);font:inherit;font-size:15px}
.search input::placeholder{color:var(--binder-muted)}
.search input:focus{outline:2px solid var(--pencil);outline-offset:0}
#treeList{flex:1;min-height:0;overflow:auto;padding-bottom:12px}
.t,.t ul{list-style:none;margin:0;padding:0}
.t ul{margin:0 0 4px 15px;padding-left:8px;border-left:1px solid var(--binder-hover)}
.row{display:flex;align-items:center;border-radius:8px}
.row.sel{background:var(--binder-sel)}
.row.plan.sel{box-shadow:inset 3px 0 0 var(--pencil)}
.chev,.spacer{width:26px;height:30px;flex:none;display:grid;place-items:center}
.chev{background:none;border:0;cursor:pointer;color:var(--binder-muted);border-radius:6px}
.chev svg{transition:transform .15s}
.chev.open svg{transform:rotate(90deg)}
.name{flex:1;min-width:0;text-align:left;background:none;border:0;color:inherit;padding:6px 4px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-radius:6px;font-size:15.5px}
.school>.row .name{font-weight:600}
.count{font-size:12.5px;color:var(--binder-muted);padding:0 8px 0 4px}
.tree-empty{color:var(--binder-muted);font-size:14.5px;padding:6px 10px}
.hit{display:block;width:100%;text-align:left;background:none;border:0;padding:7px 10px;border-radius:8px;cursor:pointer;color:inherit}
.hit:hover{background:var(--binder-hover)}
.hit small{display:block;color:var(--binder-muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub-head{font-size:12.5px;color:var(--binder-muted);padding:8px 10px 2px 30px}
.side-foot{font-size:13px;color:var(--binder-muted);padding:8px 10px 0;border-top:1px solid var(--binder-hover)}

/* ---------- main ---------- */
.main{overflow:auto;min-width:0;min-height:0}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px clamp(14px,3vw,32px)}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;min-width:0;font-size:14.5px}
.crumb{background:none;border:0;padding:2px 4px;border-radius:4px;color:var(--muted);cursor:pointer;max-width:26ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.crumb:hover{color:var(--ink);text-decoration:underline}
.crumb.cur{color:var(--ink);font-weight:600;cursor:default}
.sep{color:var(--muted)}
.only-mobile{display:none}
.content{max-width:980px;margin:0 auto;padding:24px clamp(14px,4vw,40px) 90px}
.notes{max-width:980px;margin:0 auto;padding:12px clamp(14px,4vw,40px) 0}
.note{background:var(--note-bg);border:1px solid var(--note-line);border-radius:8px;padding:10px 14px;font-size:14.5px;margin-bottom:8px}

h1,h2{font-family:'Baloo 2','Hind',sans-serif;line-height:1.2;margin:0}
.view-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:14px 20px}
.view-head h1{font-size:clamp(26px,4vw,34px);font-weight:700;overflow-wrap:anywhere}
.lede{margin:6px 0 0;color:var(--muted);max-width:62ch}
.actions{display:flex;flex-wrap:wrap;gap:8px}

.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:8px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);font-weight:600;font-size:15px;cursor:pointer;transition:background .12s,border-color .12s}
.btn:hover{border-color:var(--muted)}
.btn[disabled]{opacity:.4;cursor:default}
.btn[disabled]:hover{border-color:var(--line)}
.btn.primary{background:var(--pencil);color:var(--pencil-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(.96)}
.btn.ghost{background:transparent}
.btn.small{padding:6px 12px;font-size:14px}
.btn.danger-text{color:var(--danger)}
.btn.danger-solid{background:var(--danger-solid);color:#fff;border-color:transparent}

.list{list-style:none;margin:22px 0 0;padding:0;border-top:1px solid var(--line)}
.item{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:14px 4px;border-bottom:1px solid var(--line)}
.item-main{flex:1 1 220px;min-width:0;text-align:left;background:none;border:0;padding:0;cursor:pointer}
.item-title{display:block;font:600 19px/1.3 'Baloo 2','Hind',sans-serif;overflow-wrap:anywhere}
.item-main:hover .item-title{text-decoration:underline}
.item-sub{display:block;color:var(--muted);font-size:14.5px}
.empty{margin-top:28px;padding:26px 4px;color:var(--muted);max-width:56ch}
.empty .hero{display:block;margin-bottom:16px}
.empty h2{font-size:22px;color:var(--ink);margin-bottom:6px}
.empty p{margin:0 0 16px}
.block{margin-top:44px;padding-top:20px;border-top:1px dashed var(--line);max-width:64ch}
.block h2{font-size:20px}
.block p{color:var(--muted);margin:6px 0 14px}
.block.wide{max-width:none}
.block .list{margin-top:18px}

/* ---------- lesson plan sheet ---------- */
.plan-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:16px}
.plan-bar .grow{flex:1}
.save-state{font-size:14px;color:var(--muted)}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:26px clamp(14px,3.5vw,36px) 34px}
.sheet h1{font-size:30px;font-weight:700;display:flex;align-items:center;gap:10px}
.sheet h1 small{font:500 15px 'Hind',sans-serif;color:var(--muted);margin-left:10px}
.sheet-note{color:var(--muted);font-size:14.5px;margin:6px 0 0;max-width:70ch}
.ed-h{font-size:18px;margin:24px 0 10px}
.meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 22px;margin:20px 0 26px}
.field.full{grid-column:1/-1}
.field>span,.sec label{display:block;font-size:14px;font-weight:600;color:var(--muted);margin-bottom:4px}
.hi{font-weight:400;margin-left:8px;font-size:13.5px}
.field input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--sheet);color:var(--ink);font:500 16px 'Hind','Noto Sans Devanagari',sans-serif}
.field.full input{font:700 22px/1.3 'Baloo 2','Hind',sans-serif;padding:6px 10px}
.sec{margin-bottom:22px}
.dlist{margin-bottom:10px}
.drow{display:flex;gap:8px;margin-bottom:8px}
.drow input{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--sheet);color:var(--ink);font:500 16px 'Hind','Noto Sans Devanagari',sans-serif}

/* section blocks (a row of the lesson plan table) */
.tsec{border:1px solid var(--line);border-radius:8px;margin:0 0 16px;background:var(--sheet);overflow:hidden}
.tsec-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 10px;background:var(--head);border-bottom:1px solid var(--line)}
.tsec-head input{font:600 16px 'Hind','Noto Sans Devanagari',sans-serif;color:var(--ink);background:transparent;border:1px solid transparent;border-radius:6px;padding:5px 8px}
.tsec-head input:hover{border-color:var(--line)}
.tsec-head input:focus{background:var(--sheet)}
.tsec-head .no{width:64px;text-align:center}
.tsec-head .ttl{flex:1 1 200px;min-width:0}
.tools{display:flex;gap:4px;margin-left:auto}
.tools .btn{padding:4px 10px;font-size:14px}
.tbody{display:grid;grid-template-columns:minmax(0,34%) minmax(0,1fr)}
.tleft{padding:12px 12px 14px;border-right:1px solid var(--line)}
.tright{padding:12px 12px 14px;min-width:0}
.titems{list-style:none;margin:0 0 8px;padding:0}
.titems li{display:flex;align-items:center;gap:6px}
.titems .dot{width:6px;height:6px;border-radius:50%;background:var(--ink);flex:none}
.titems input{flex:1;min-width:0;border:0;border-bottom:1px solid transparent;background:transparent;color:inherit;font:inherit;padding:5px 2px}
.titems input:hover{border-bottom-color:var(--line)}
.titems .btn{padding:0 8px;line-height:1.5}
.fl{width:100%;border:0;border-bottom:1px dashed var(--line);background:transparent;color:var(--muted);font:600 14.5px 'Hind','Noto Sans Devanagari',sans-serif;padding:2px 0;margin-bottom:8px}
.tpl-note{margin:0;color:var(--muted);font-size:14px}
.tfoot{padding:8px 12px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.chk{display:flex;align-items:center;gap:8px;cursor:pointer}

textarea.ruled{
  display:block;width:100%;resize:none;overflow:hidden;
  font:400 16px/28px 'Hind','Noto Sans Devanagari','Mangal',sans-serif;color:var(--ink);
  padding:0 14px 0 48px;border:1px solid var(--line);border-radius:6px;
  background-color:var(--sheet);
  background-image:
    linear-gradient(90deg,transparent 34px,var(--margin) 34px,var(--margin) 35px,transparent 35px),
    repeating-linear-gradient(180deg,transparent 0,transparent 27px,var(--rule) 27px,var(--rule) 28px);
  background-attachment:local,local;
}
textarea.ruled.slim{
  padding-left:12px;
  background-image:repeating-linear-gradient(180deg,transparent 0,transparent 27px,var(--rule) 27px,var(--rule) 28px);
  background-attachment:local;
}
textarea.ruled::placeholder{color:var(--muted);opacity:.7}
input.invalid{border-color:var(--danger)!important}

.file-card{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:0 0 22px}
.file-ico{flex:none;min-width:54px;text-align:center;font:700 14px 'Baloo 2','Hind',sans-serif;background:var(--pencil);color:var(--pencil-ink);border-radius:6px;padding:8px 6px}
.file-card strong{display:block;overflow-wrap:anywhere}
.file-card span{color:var(--muted);font-size:14px}
.preview{display:block;max-width:100%;border:1px solid var(--line);border-radius:8px;margin:0 0 22px}

/* ---------- modal + toast ---------- */
.modal-back{position:fixed;inset:0;background:rgba(10,14,30,.55);display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));z-index:50}
.modal{background:var(--sheet);color:var(--ink);border:1px solid var(--line);border-radius:12px;width:100%;max-width:430px;padding:22px}
.modal h2{font-size:21px;margin-bottom:8px}
.modal p{margin:0 0 12px;color:var(--muted);overflow-wrap:anywhere}
.modal .field input{margin-top:2px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--binder);color:#fff;border:1px solid var(--line);padding:10px 16px;border-radius:8px;max-width:min(92vw,460px);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;font-size:15px}
#toast.show{opacity:1}

/* ---------- small screens ---------- */
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;top:0;bottom:0;left:0;width:min(86vw,340px);z-index:30;transform:translateX(-102%);transition:transform .2s;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
  body.menu-open .side{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(10,14,30,.5);z-index:25;display:none}
  body.menu-open .scrim{display:block}
  .only-mobile{display:inline-flex}
  .meta{grid-template-columns:minmax(0,1fr)}
  .tbody{grid-template-columns:minmax(0,1fr)}
  .tleft{border-right:0;border-bottom:1px solid var(--line)}
  .actions .btn,.plan-bar .btn{flex:1 1 auto;justify-content:center}
  .tools{margin-left:0}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
/* ===== File builders (Word, web page) ===== */
function safeName(n){
  return String(n==null?'':n).replace(/[\\\/:*?"<>|\u0000-\u001f]+/g,'-').replace(/\s+/g,' ').trim().replace(/^\.+/,'').slice(0,80)||'Untitled';
}
function fmtDate(v){
  if(!v) return '';
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(v);
  if(!m) return String(v);
  return new Date(+m[1],+m[2]-1,+m[3]).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
}
function secHead(x){
  const no=String(x.no||'').trim(), t=String(x.title||'').trim();
  return (no?(/^\d+$/.test(no)?no+'. ':no+' '):'')+t;
}
function detailRows(s,c,p){
  const r=[['School',s.name],['Class',c.name],['Topic',p.title||'Untitled lesson plan']];
  (p.details||[]).forEach(d=>{
    let v=d.value; if(d.type==='date') v=fmtDate(v);
    if(v&&String(v).trim()) r.push([d.label||'Detail',v]);
  });
  return r;
}
const xesc=s=>String(s==null?'':s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function wRun(t,o){
  o=o||{};
  return '<w:r><w:rPr>'+(o.b?'<w:b/><w:bCs/>':'')+(o.color?'<w:color w:val="'+o.color+'"/>':'')+(o.sz?'<w:sz w:val="'+o.sz+'"/><w:szCs w:val="'+o.sz+'"/>':'')+'</w:rPr><w:t xml:space="preserve">'+xesc(t)+'</w:t></w:r>';
}
function wLines(text){
  const clean=String(text==null?'':text).replace(/\s+$/,'');
  if(!clean.trim()) return '<w:p/>';
  return clean.split(/\r?\n/).map(l=>l.trim()?'<w:p>'+wRun(l)+'</w:p>':'<w:p/>').join('');
}
function wCell(w,inner,o){
  o=o||{};
  return '<w:tc><w:tcPr><w:tcW w:w="'+w+'" w:type="dxa"/>'+(o.span?'<w:gridSpan w:val="'+o.span+'"/>':'')+(o.fill?'<w:shd w:val="clear" w:color="auto" w:fill="'+o.fill+'"/>':'')+'</w:tcPr>'+inner+'</w:tc>';
}
const W_NS='http://schemas.openxmlformats.org/wordprocessingml/2006/main';
function docXml(s,c,p){
  const bd=k=>'<w:'+k+' w:val="single" w:sz="4" w:space="0" w:color="BFC7DA"/>';
  const info=detailRows(s,c,p).map(r=>'<w:tr>'+wCell(2600,'<w:p>'+wRun(r[0],{b:1})+'</w:p>',{fill:'EEF1F8'})+wCell(6400,wLines(r[1]))+'</w:tr>').join('');
  const secs=(p.sections||[]).map(x=>{
    const head='<w:tr>'+wCell(9000,'<w:p><w:pPr><w:keepNext/></w:pPr>'+wRun(secHead(x)||'Section',{b:1,color:'22305C'})+'</w:p>',{span:2,fill:'EEF1F8'})+'</w:tr>';
    if(!x.showBody) return head;
    const items=(x.items||[]).map(i=>String(i).trim()).filter(Boolean);
    const fb=(x.feedbackLabel?'<w:p>'+wRun(x.feedbackLabel,{b:1,sz:20,color:'5A6482'})+'</w:p>':'')+wLines(x.feedback);
    if(!items.length) return head+'<w:tr>'+wCell(9000,fb,{span:2})+'</w:tr>';
    return head+'<w:tr>'+wCell(2600,items.map(i=>'<w:p>'+wRun('\u2022  '+i)+'</w:p>').join(''))+wCell(6400,fb)+'</w:tr>';
  }).join('');
  const table='<w:tbl><w:tblPr><w:tblW w:w="5000" w:type="pct"/><w:tblBorders>'+['top','left','bottom','right','insideH','insideV'].map(bd).join('')+'</w:tblBorders>'
    +'<w:tblCellMar><w:top w:w="70" w:type="dxa"/><w:left w:w="110" w:type="dxa"/><w:bottom w:w="70" w:type="dxa"/><w:right w:w="110" w:type="dxa"/></w:tblCellMar></w:tblPr>'
    +'<w:tblGrid><w:gridCol w:w="2600"/><w:gridCol w:w="6400"/></w:tblGrid>'+info+secs+'</w:tbl>';
  const title='<w:p><w:pPr><w:pStyle w:val="Title"/></w:pPr>'+wRun('Lesson Plan')+wRun('   \u092A\u093E\u0920 \u092F\u094B\u091C\u0928\u093E',{sz:26,color:'5A6482'})+'</w:p>';
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="'+W_NS+'"><w:body>'+title+table+'<w:p/>'
    +'<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1200" w:right="1440" w:bottom="1200" w:left="1440" w:header="708" w:footer="708" w:gutter="0"/></w:sectPr></w:body></w:document>';
}

<script>
(function(){

/* ---------- the starting format (taken from the observation sheet photo) ---------- */
function defaultTemplate(){
  const S=(no,title,items,o)=>Object.assign({id:uid(),no:no,title:title,items:items,feedbackLabel:'Descriptive Feedback:',showBody:true},o||{});
  return {

    ],

      S('3.2','Student Engagement and Participation',['Explanation of Topic','IBL (Inquiry-Based Learning)','Students come forward','Presentation by Students','Completion of activity','Students participation']),
      S('4','Closing of Session',['Conclude by FAQ','Conclude the session by students','Quiz','Presentation by Students','Assignment','Student Feedback']),

/* ---------- data ---------- */
const str=v=>typeof v==='string'?v:(v==null?'':String(v));
function normSection(x,withFeedback){
  return {
    id:str(x&&x.id)||uid(), no:str(x&&x.no), title:str(x&&x.title),
    items:(x&&Array.isArray(x.items)?x.items:[]).map(str),
    feedbackLabel:str(x&&x.feedbackLabel), showBody:!(x&&x.showBody===false),
    feedback:withFeedback?str(x&&x.feedback):''
  };
}
function normDetail(d,withValue){
  const o={id:str(d&&d.id)||uid(),label:str(d&&d.label)};
  if(d&&d.key) o.key=str(d.key);
  if(d&&d.type==='date') o.type='date';
  if(withValue) o.value=str(d&&d.value);
  return o;
}
function normTemplate(t){
  if(!t||!Array.isArray(t.sections)) return defaultTemplate();
  return {details:(Array.isArray(t.details)?t.details:[]).map(d=>normDetail(d,false)),sections:t.sections.map(x=>normSection(x,false))};
}
const OLD_DETAILS=[['subject','Subject'],['chapter','Chapter / unit'],['teacher','Teacher'],['date','Date'],['duration','Period / duration']];
const OLD_SECTIONS=[['objectives','Learning objectives'],['prior','Previous knowledge'],['aids','Teaching aids'],['intro','Introduction'],['main','Main teaching steps'],['activity','Student activity'],['assessment','Assessment questions'],['homework','Homework'],['reflection',"Teacher's reflection"]];
function normPlan(p){
  const np={id:str(p.id)||uid(),updated:Number(p.updated)||Date.now(),title:str(p.title)};
  if(Array.isArray(p.sections)){
    np.details=(Array.isArray(p.details)?p.details:[]).map(d=>normDetail(d,true));
    np.sections=p.sections.map(x=>normSection(x,true));
  } else { /* plan saved in the earlier fixed format: keep everything the teacher wrote */
    np.details=OLD_DETAILS.map(o=>{const d={id:uid(),label:o[1],value:str(p[o[0]])}; if(o[0]==='teacher') d.key='teacher'; if(o[0]==='date') d.type='date'; return d;});
    np.sections=OLD_SECTIONS.filter(o=>str(p[o[0]]).trim()).map(o=>({id:uid(),no:'',title:o[1],items:[],feedbackLabel:'',showBody:true,feedback:str(p[o[0]])}));
    if(!np.sections.length) np.sections=defaultTemplate().sections.map(x=>Object.assign(x,{feedback:''}));
  }
  return np;
}
function normalize(d){
  if(!d||!Array.isArray(d.schools)) throw new Error('bad');
  const out={schools:[],prefs:{teacher:str(d.prefs&&d.prefs.teacher)}};
  d.schools.forEach(s=>{
    if(!s) return;
    const ns={id:str(s.id)||uid(),name:str(s.name)||'Untitled school',classes:[],template:normTemplate(s.template)};
    (Array.isArray(s.classes)?s.classes:[]).forEach(c=>{
      if(!c) return;
      const nc={id:str(c.id)||uid(),name:str(c.name)||'Untitled class',plans:[],custom:[]};
      (Array.isArray(c.plans)?c.plans:[]).forEach(p=>{ if(p) nc.plans.push(normPlan(p)); });
      (Array.isArray(c.custom)?c.custom:[]).forEach(x=>{
        if(!x) return;
        const f=x.file||{};
        nc.custom.push({id:str(x.id)||uid(),title:str(x.title)||'Untitled lesson plan',note:str(x.note),updated:Number(x.updated)||Date.now(),file:{name:str(f.name),type:str(f.type),size:Number(f.size)||0}});
      });
      ns.classes.push(nc);
    });
    out.schools.push(ns);
  });
  return out;
}
function loadData(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw) return normalize(JSON.parse(raw));

}
let data=loadData();
let saveTimer=null;

const getS=id=>data.schools.find(s=>s.id===id);

    sections:t.sections.map(x=>({id:uid(),no:x.no,title:x.title,items:x.items.slice(),feedbackLabel:x.feedbackLabel,showBody:x.showBody,feedback:''}))

/* uploaded files live in IndexedDB (they are too big for localStorage) */
const FDB={
  db:null,
  open(){
    return new Promise((res,rej)=>{
      if(this.db) return res(this.db);
      let r; try{ r=indexedDB.open('lesson-plan-files',1); }catch(e){ return rej(e); }
      r.onupgradeneeded=()=>{ r.result.createObjectStore('files'); };
      r.onsuccess=()=>{ this.db=r.result; res(this.db); };
      r.onerror=()=>rej(r.error);
    });
  },
  async tx(mode,fn){
    const db=await this.open();
    return new Promise((res,rej)=>{
      const t=db.transaction('files',mode), rq=fn(t.objectStore('files'));
      t.oncomplete=()=>res(rq&&rq.result); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error);
    });
  },
  put(id,v){ return this.tx('readwrite',s=>s.put(v,id)); },
  get(id){ return this.tx('readonly',s=>s.get(id)); },
  del(id){ return this.tx('readwrite',s=>s.delete(id)); },
  clear(){ return this.tx('readwrite',s=>s.clear()); }
};
const dropFiles=ids=>Promise.all(ids.map(id=>FDB.del(id).catch(()=>{})));

/* ---------- modal ---------- */
function modal(o){
  return new Promise(resolve=>{
    const root=$('#modalRoot');
    const prev=document.activeElement;
    root.innerHTML='<div class="modal-back"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><h2 id="mt">'+esc(o.title)+'</h2>'
      +(o.body?'<p>'+esc(o.body)+'</p>':'')
      +(o.input?'<label class="field"><span>'+esc(o.input.label)+'</span><input id="mi" type="text" maxlength="120" autocomplete="off" value="'+esc(o.input.value||'')+'" placeholder="'+esc(o.input.ph||'')+'"></label>':'')
      +'<div class="modal-actions"><button type="button" class="btn ghost" data-m="cancel">Cancel</button><button type="button" class="btn '+(o.danger?'danger-solid':'primary')+'" data-m="ok">'+esc(o.confirmText||'OK')+'</button></div></div></div>';
    const back=root.firstElementChild, inp=$('#mi',root);
    const cancelValue=o.input?null:false;
    function close(v){
      root.innerHTML=''; document.removeEventListener('keydown',onKey,true);
      if(prev&&prev.focus&&document.contains(prev)) prev.focus();
      resolve(v);
    }
    function ok(){
      if(o.input){
        const v=inp.value.trim();
        if(!v){ inp.classList.add('invalid'); inp.focus(); return; }
        close(v);
      } else close(true);
    }
    function onKey(e){
      if(e.key==='Escape'){ e.preventDefault(); close(cancelValue); }
      else if(e.key==='Enter'&&inp&&document.activeElement===inp){ e.preventDefault(); ok(); }
      else if(e.key==='Tab'){
        const f=$$('input,button',root); if(!f.length) return;
        const first=f[0], last=f[f.length-1];
        if(e.shiftKey&&document.activeElement===first){ e.preventDefault(); last.focus(); }
        else if(!e.shiftKey&&document.activeElement===last){ e.preventDefault(); first.focus(); }
      }
    }
    document.addEventListener('keydown',onKey,true);
    back.addEventListener('click',ev=>{
      const b=ev.target.closest('[data-m]');
      if(b){ if(b.dataset.m==='ok') ok(); else close(cancelValue); }
      else if(ev.target===back) close(cancelValue);
    });
    if(inp){ inp.focus(); inp.select(); }
    else (o.danger?$('[data-m="cancel"]',root):$('[data-m="ok"]',root)).focus();
  });
}
const askName=(title,label,value,confirmText,ph)=>modal({title,input:{label,value,ph},confirmText});

/* ---------- rendering: sidebar ---------- */
const chevSvg='<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M4 2l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';

      +(so?'<ul>'+s.classes.map(c=>{
        const co=ui.exp.has(c.id), csel=v.type==='class'&&v.cid===c.id;

async function loadPreview(x){

/* ---------- downloads ---------- */
const MIME_BY_EXT={docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',zip:'application/zip',html:'text/html;charset=utf-8',json:'application/json'};
function browserDownload(filename,payload){
  const blob=(payload instanceof Blob)?payload:new Blob([payload],{type:MIME_BY_EXT[extOf(filename)]||'application/octet-stream'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=filename; a.rel='noopener'; a.style.display='none';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
}
async function saveFile(filename,payload){
  if(dl){
    try{ await dl.save({filename:filename,data:payload}); toast('Downloaded: '+filename); return; }
    catch(err){
      const code=err&&err.code;
      toast(code==='declined'?'Download cancelled.':code==='rate_limited'?'Please wait a moment, then try again.':code==='too_large'?'That file is too large to save.':'The download could not be saved.');
      return;
    }
  }
  try{ browserDownload(filename,payload); toast('Downloaded: '+filename); }
  catch(err){ toast('The download could not be saved. Your browser may be blocking it — check for a blocked pop-up or download.'); }
}
function needZip(){
  if(typeof JSZip==='undefined'){ toast('The file tool did not load. Check your internet connection and reload.'); return false; }
  return true;
}
function uniq(used,base){
  let name=base,n=2;
  while(used.has(name.toLowerCase())) name=base+' ('+(n++)+')';
  used.add(name.toLowerCase()); return name;
}
async function addClassFiles(folder,s,c){
  const used=new Set();
  for(const p of c.plans){
    const name=uniq(used,safeName(p.title||'Untitled lesson plan'));
    folder.file(name+'.docx',await docxBytes(s,c,p));
  }
  if(c.custom.length){
    const sub=folder.folder('My own lesson plans'), usedX=new Set();
    for(const x of c.custom){
      let rec=null; try{ rec=await FDB.get(x.id); }catch(e){}
      if(!rec) continue;
      const ext=extOf(x.file.name);
      const name=uniq(usedX,safeName(x.title||'Untitled lesson plan'));
      sub.file(name+(ext?'.'+ext:''),rec.buf.slice(0));
    }
  }
}
async function addSchool(root,s){
  const used=new Set();
  for(const c of s.classes) await addClassFiles(root.folder(uniq(used,safeName(c.name))),s,c);
}
async function dlCustom(x){
  try{
    const rec=await FDB.get(x.id);
    if(!rec) return toast('This file is not stored in this browser. Use Replace file to upload it again.');
    const ext=extOf(x.file.name);
    await saveFile(safeName(x.title||'Lesson plan')+(ext?'.'+ext:''),rec.buf.slice(0));
  }catch(e){ toast('Could not read the uploaded file.'); }
}
async function backupZip(){
  if(!needZip()) return;
  try{
    toast('Preparing backup…');
    const zip=new JSZip(), files=zip.folder('files');
    zip.file('data.json',JSON.stringify(data,null,2));
    for(const s of data.schools) for(const c of s.classes) for(const x of c.custom){
      let rec=null; try{ rec=await FDB.get(x.id); }catch(e){}
      if(rec) files.file(x.id,rec.buf.slice(0));
    }
    const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE'});
    await saveFile('lesson-plans-backup-'+new Date().toISOString().slice(0,10)+'.zip',blob);
  }catch(e){ toast('Could not build the backup. Try again.'); }
}
async function dlPlan(kind,s,c,p){
  try{
    const base=safeName(c.name)+' - '+safeName(p.title||'Lesson plan');
    if(kind==='html'){ await saveFile(base+'.html',planHtml(s,c,p)); return; }
    if(!needZip()) return;
    toast('Preparing Word file…');
    await saveFile(base+'.docx',await docxBytes(s,c,p));
  }catch(e){ toast('Could not build the file. Try again.'); }
}
async function dlZip(kind,s,c){
  if(!needZip()) return;
  try{
    const zip=new JSZip(); let name;
    if(kind==='class'){
      if(!planCount(c)) return toast('This class has no lesson plans yet.');
      toast('Preparing folder…');
      await addClassFiles(zip.folder(safeName(c.name)),s,c);
      name=safeName(s.name)+' - '+safeName(c.name)+'.zip';
    } else if(kind==='school'){
      if(!planCount(s)) return toast('This school has no lesson plans yet.');
      toast('Preparing folder…');
      await addSchool(zip.folder(safeName(s.name)),s);
      name=safeName(s.name)+'.zip';
    } else {
      if(!data.schools.some(x=>planCount(x))) return toast('There are no lesson plans yet.');
      toast('Preparing folders…');
      const used=new Set();
      for(const sc of data.schools) await addSchool(zip.folder(uniq(used,safeName(sc.name))),sc);
      name='All lesson plans.zip';
    }
    const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE'});
    await saveFile(name,blob);
  }catch(e){ toast('Could not build the folder. Try again.'); }
}
let uploadTarget=null;
function startUpload(t){ uploadTarget=t; const i=$('#uploadFile'); i.multiple=!t.xid; i.click(); }

/* ---------- editor actions (lesson plan and school format) ---------- */
function getTarget(){
  const v=ui.view, s=getS(v.sid);
  if(v.type==='plan'){ const c=getC(s,v.cid), p=getP(c,v.pid); return p?{kind:'plan',obj:p,s,c}:null; }
  if(v.type==='format') return s?{kind:'format',obj:s.template,s}:null;
  return null;
}
function touched(T){ if(T.kind==='plan') T.obj.updated=Date.now(); commit(); }
const EDITOR_ACTS=['sec-add','sec-up','sec-down','sec-del','item-add','item-del','detail-add','detail-del','tpl-reset'];
async function editorAction(act,d,el){
  const T=getTarget(); if(!T) return;
  const t=T.obj;
  const secEl=el.closest('[data-sec]');
  const idx=secEl?t.sections.findIndex(x=>x.id===secEl.dataset.sec):-1;
  const sec=idx>=0?t.sections[idx]:null;
  let focus=null;
  switch(act){
    case 'sec-add': {
      const last=t.sections[t.sections.length-1], m=last&&/^(\d+)/.exec(last.no||'');
      const ns={id:uid(),no:m?String(+m[1]+1):'',title:'New section',items:[],feedbackLabel:'Descriptive Feedback:',feedback:'',showBody:true};
      t.sections.push(ns); focus='[data-sec="'+ns.id+'"] [data-pf="stitle"]'; break;
    }
    case 'sec-up': if(idx>0){ const a=t.sections[idx]; t.sections[idx]=t.sections[idx-1]; t.sections[idx-1]=a; focus='[data-sec="'+a.id+'"] [data-act="sec-up"]'; } break;
    case 'sec-down': if(idx>=0&&idx<t.sections.length-1){ const a=t.sections[idx]; t.sections[idx]=t.sections[idx+1]; t.sections[idx+1]=a; focus='[data-sec="'+a.id+'"] [data-act="sec-down"]'; } break;
    case 'sec-del': {
      if(!sec) return;
      const ok=await confirmBox('Delete this section?','"'+(secHead(sec)||'Untitled section')+'" will be removed'+(T.kind==='plan'?' from this lesson plan, along with anything you wrote in it':' from the format')+'.','Delete section',true);
      if(!ok) return; t.sections.splice(t.sections.findIndex(x=>x.id===sec.id),1); break;
    }
    case 'item-add': if(sec){ sec.items.push(''); focus='[data-sec="'+sec.id+'"] [data-pf="item"][data-idx="'+(sec.items.length-1)+'"]'; } break;
    case 'item-del': if(sec){ sec.items.splice(+d.idx,1); focus='[data-sec="'+sec.id+'"] [data-act="item-add"]'; } break;
    case 'detail-add': { const nd={id:uid(),label:'New detail'}; t.details.push(nd); focus='[data-did="'+nd.id+'"]'; break; }
    case 'detail-del': t.details=t.details.filter(x=>x.id!==d.did); break;
    case 'tpl-reset': {
      const ok=await confirmBox('Reset to the standard format?','The sections and details of this school\'s format will go back to the standard format. Lesson plans you already made are not changed.','Reset format',true);
      if(!ok) return; T.s.template=defaultTemplate(); break;
    }
  }
  touched(T); renderMain();
  if(focus){ const f=$(focus); if(f){ f.focus(); if(f.type==='text'&&f.select) f.select(); } }
}

/* ---------- actions ---------- */
async function handle(act,d,el){
  if(EDITOR_ACTS.includes(act)) return editorAction(act,d,el);
  const s=d.sid?getS(d.sid):null, c=s&&d.cid?getC(s,d.cid):null, p=c&&d.pid?getP(c,d.pid):null, x=c&&d.xid?getX(c,d.xid):null;
  switch(act){
    case 'home': return go({type:'home'});
    case 'open-school': return s&&go({type:'school',sid:s.id});
    case 'open-class': return c&&go({type:'class',sid:s.id,cid:c.id});
    case 'open-plan': return p&&go({type:'plan',sid:s.id,cid:c.id,pid:p.id});
    case 'open-custom': return x&&go({type:'custom',sid:s.id,cid:c.id,xid:x.id});
    case 'edit-format': return s&&go({type:'format',sid:s.id});
    case 'upload': return c&&startUpload({sid:s.id,cid:c.id});
    case 'replace-custom': return x&&startUpload({sid:s.id,cid:c.id,xid:x.id});
    case 'dl-custom': return x&&dlCustom(x);
    case 'delete-custom': {
      if(!x) return;
      const ok=await confirmBox('Delete this uploaded lesson plan?','"'+(x.title||'Untitled lesson plan')+'" and its file will be removed from this browser. This cannot be undone.','Delete lesson plan',true);
      if(!ok) return; await dropFiles([x.id]); c.custom=c.custom.filter(k=>k.id!==x.id); commit(); return go({type:'class',sid:s.id,cid:c.id});
    }
    case 'toggle':
      if(ui.exp.has(d.id)) ui.exp.delete(d.id); else ui.exp.add(d.id);
      return renderTree();
    case 'add-school': {
      const name=await askName('Add school','School name','','Add school'); if(!name) return;
      const ns={id:uid(),name,classes:[],template:defaultTemplate()}; data.schools.push(ns); commit(); return go({type:'school',sid:ns.id});
    }
    case 'add-class': {
      if(!s) return;
      const name=await askName('Add class','Class name','','Add class','e.g. Class 6-A'); if(!name) return;
      const nc={id:uid(),name,plans:[],custom:[]}; s.classes.push(nc); commit(); return go({type:'class',sid:s.id,cid:nc.id});
    }
    case 'add-plan': {
      if(!c) return;
      const name=await askName('Add lesson plan','Topic','','Add lesson plan'); if(!name) return;
      const np=planFromTemplate(s,name); c.plans.push(np); commit(); return go({type:'plan',sid:s.id,cid:c.id,pid:np.id});
    }
    case 'rename-school': {
      if(!s) return; const name=await askName('Rename school','School name',s.name,'Save name'); if(!name) return;
      s.name=name; commit(); return render();
    }
    case 'rename-class': {
      if(!c) return; const name=await askName('Rename class','Class name',c.name,'Save name'); if(!name) return;
      c.name=name; commit(); return render();
    }
    case 'delete-school': {
      if(!s) return;
      const ok=await confirmBox('Delete this school?','"'+s.name+'" and its '+pl(s.classes.length,'class','classes')+' and '+pl(planCount(s),'lesson plan')+' will be removed. This cannot be undone.','Delete school',true);
      if(!ok) return; await dropFiles(customIds(s)); data.schools=data.schools.filter(k=>k.id!==s.id); commit(); return go({type:'home'});
    }
    case 'delete-class': {
      if(!c) return;
      const ok=await confirmBox('Delete this class?','"'+c.name+'" and its '+pl(planCount(c),'lesson plan')+' will be removed. This cannot be undone.','Delete class',true);
      if(!ok) return; await dropFiles(customIds(c)); s.classes=s.classes.filter(k=>k.id!==c.id); commit(); return go({type:'school',sid:s.id});
    }
    case 'delete-plan': {
      if(!p) return;
      const ok=await confirmBox('Delete this lesson plan?','"'+(p.title||'Untitled lesson plan')+'" will be removed. This cannot be undone.','Delete lesson plan',true);
      if(!ok) return; c.plans=c.plans.filter(k=>k.id!==p.id); commit(); return go({type:'class',sid:s.id,cid:c.id});
    }
    case 'dup-plan': {
      if(!p) return;
      const copy=JSON.parse(JSON.stringify(p)); copy.id=uid(); copy.title=(p.title||'Untitled lesson plan')+' (copy)'; copy.updated=Date.now();
      c.plans.splice(c.plans.indexOf(p)+1,0,copy); commit(); toast('Lesson plan duplicated.');
      return go({type:'plan',sid:s.id,cid:c.id,pid:copy.id});
    }
    case 'dl-plan-docx': return p&&dlPlan('docx',s,c,p);
    case 'dl-plan-html': return p&&dlPlan('html',s,c,p);
    case 'dl-class-zip': return c&&dlZip('class',s,c);
    case 'dl-school-zip': return s&&dlZip('school',s);
    case 'dl-all-zip': return dlZip('all');
    case 'backup': return backupZip();
    case 'restore': return $('#restoreFile').click();
  }
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]'); if(!t) return;
  handle(t.dataset.act,t.dataset,t).catch(()=>toast('Something went wrong. Try again.'));
});
$('#restoreFile').addEventListener('change',async e=>{
  const f=e.target.files&&e.target.files[0]; e.target.value=''; if(!f) return;
  let d, z=null;
  try{
    if(/\.zip$/i.test(f.name)){
      if(!needZip()) return;
      z=await JSZip.loadAsync(f);
      const j=z.file('data.json'); if(!j) throw new Error('no data');
      d=normalize(JSON.parse(await j.async('string')));
    } else d=normalize(JSON.parse(await f.text()));
  }catch(err){ return toast('That file is not a valid backup.'); }
  const n=d.schools.reduce((a,s)=>a+planCount(s),0);
  const ok=await confirmBox('Restore this backup?','This replaces everything in this browser with the backup ('+pl(d.schools.length,'school')+', '+pl(n,'lesson plan')+'). Save a backup of your current data first if you need it.','Restore backup',true);
  if(!ok) return;
  try{ await FDB.clear(); }catch(err){}
  let missing=0;
  for(const s of d.schools) for(const c of s.classes) for(const x of c.custom){
    const ent=z&&z.file('files/'+x.id);
    if(!ent){ missing++; continue; }
    try{ await FDB.put(x.id,{buf:await ent.async('arraybuffer'),name:x.file.name,type:x.file.type}); }catch(err){ missing++; }
  }
  data=d; ui.exp=new Set(data.schools.map(s=>s.id)); commit(); go({type:'home'});
  toast(missing?'Backup restored. '+pl(missing,'uploaded file')+' could not be restored.':'Backup restored.');
});
$('#uploadFile').addEventListener('change',async e=>{
  const files=Array.from(e.target.files||[]); e.target.value='';
  const t=uploadTarget; uploadTarget=null;
  if(!files.length||!t) return;
  const s=getS(t.sid), c=getC(s,t.cid); if(!c) return;
  const bad=[], made=[];
  toast('Uploading…');
  for(const f of files){
    if(!UPLOAD_EXT.includes(extOf(f.name))){ bad.push(f.name); continue; }
    if(f.size>MAX_UPLOAD){ bad.push(f.name+' (over 25 MB)'); continue; }
    try{
      const buf=await f.arrayBuffer();
      const meta={name:f.name,type:f.type||'',size:f.size};
      if(t.xid){
        const x=getX(c,t.xid); if(!x) continue;
        await FDB.put(x.id,{buf,name:f.name,type:meta.type}); x.file=meta; x.updated=Date.now(); made.push(x);
      } else {
        const x={id:uid(),title:f.name.replace(/\.[^.]+$/,'')||'Untitled lesson plan',note:'',updated:Date.now(),file:meta};
        await FDB.put(x.id,{buf,name:f.name,type:meta.type}); c.custom.push(x); made.push(x);
      }
    }catch(err){ bad.push(f.name+' (could not be stored)'); }
  }
  commit();
  if(made.length===1) go({type:'custom',sid:s.id,cid:c.id,xid:made[0].id});
  else go({type:'class',sid:s.id,cid:c.id});
  if(bad.length) toast((made.length?pl(made.length,'file')+' uploaded. ':'')+'Not uploaded: '+bad.join(', ')+'. Use Word (.docx), PDF, PowerPoint, Excel, text or a photo.');
  else if(made.length>1) toast(pl(made.length,'lesson plan')+' uploaded.');
  else if(made.length===1&&t.xid) toast('File replaced.');
});

/* typing: update the data straight away, save after a short pause */
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='q'){ ui.query=el.value; return renderTree(); }
  const ckey=el.dataset&&el.dataset.cfield;
  if(ckey){
    const cv=ui.view; if(cv.type!=='custom') return;
    const cs=getS(cv.sid), cc=getC(cs,cv.cid), cx=getX(cc,cv.xid); if(!cx) return;
    cx[ckey]=el.value; cx.updated=Date.now();
    if(el.tagName==='TEXTAREA') autosize(el);
    if(ckey==='title'){ renderTree(); renderCrumbs(); }
    return scheduleSave();
  }
  const pf=el.dataset&&el.dataset.pf; if(!pf||pf==='showBody') return;
  const T=getTarget(); if(!T) return;
  const t=T.obj, secEl=el.closest('[data-sec]');
  const sec=secEl?t.sections.find(x=>x.id===secEl.dataset.sec):null;
  const det=el.dataset.did?t.details.find(x=>x.id===el.dataset.did):null;
  switch(pf){
    case 'ptitle': if(T.kind!=='plan') return; t.title=el.value; renderTree(); renderCrumbs(); break;
    case 'dval': if(!det) return; det.value=el.value; if(det.key==='teacher') data.prefs.teacher=el.value; break;
    case 'dlabel': if(!det) return; det.label=el.value; break;
    case 'no': if(!sec) return; sec.no=el.value; break;
    case 'stitle': if(!sec) return; sec.title=el.value; break;
    case 'item': if(!sec) return; sec.items[+el.dataset.idx]=el.value; break;
    case 'feedbackLabel': if(!sec) return; sec.feedbackLabel=el.value; break;
    case 'feedback': if(!sec) return; sec.feedback=el.value; autosize(el); break;
    default: return;
  }
  if(T.kind==='plan') t.updated=Date.now();
  scheduleSave();
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(!(el.dataset&&el.dataset.pf==='showBody')) return;
  const T=getTarget(); if(!T) return;
  const secEl=el.closest('[data-sec]'), sec=secEl&&T.obj.sections.find(x=>x.id===secEl.dataset.sec); if(!sec) return;
  sec.showBody=el.checked; touched(T); renderMain();
  const f=$('[data-sec="'+sec.id+'"] [data-pf="showBody"]'); if(f) f.focus();
});
window.addEventListener('resize',()=>{ if(['plan','format','custom'].includes(ui.view.type)) autosizeAll(); });
$('#openMenu').addEventListener('click',()=>document.body.classList.add('menu-open'));
$('#closeMenu').addEventListener('click',closeMenu);
$('#scrim').addEventListener('click',closeMenu);
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeMenu(); });

/* ---------- downloads capability (lights up when available) ---------- */
(async function initDownloads(){
  for(let i=0;i<6;i++){
    if(window.claude&&typeof window.claude.use==='function'){
      try{ dl=await window.claude.use('downloads'); }catch(e){ dl=null; }
      break;
    }
    await new Promise(r=>setTimeout(r,700));
  }
})();

render();
})();
</script>
